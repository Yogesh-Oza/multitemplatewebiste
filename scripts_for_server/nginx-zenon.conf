# Zenon Consulting — HTTPS reverse proxy (certbot-managed SSL)
# DNS: zenonconsulting.in + www → 159.89.161.19
# App: Next.js on 127.0.0.1:3004 (pm2: zenon)
#
# Initial SSL setup:
#   certbot --nginx -d zenonconsulting.in -d www.zenonconsulting.in
# Cert auto-renews via certbot timer.

server {
    server_name zenonconsulting.in www.zenonconsulting.in;

    access_log /var/log/nginx/zenon-access.log;
    error_log /var/log/nginx/zenon-error.log warn;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
