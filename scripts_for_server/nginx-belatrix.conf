# Belatrix — HTTPS reverse proxy (certbot-managed SSL)
# DNS: belatrixservices.com + www → 159.89.161.19
# App: Next.js on 127.0.0.1:3003 (pm2: belatrix)
#
# Initial SSL setup:
#   certbot --nginx -d belatrixservices.com -d www.belatrixservices.com
# Cert auto-renews via certbot timer.

server {
    server_name belatrixservices.com www.belatrixservices.com;

    access_log /var/log/nginx/belatrix-access.log belatrix_traffic;
    error_log /var/log/nginx/belatrix-error.log warn;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/belatrixservices.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/belatrixservices.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.belatrixservices.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = belatrixservices.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name belatrixservices.com www.belatrixservices.com;
    return 404; # managed by Certbot
}
