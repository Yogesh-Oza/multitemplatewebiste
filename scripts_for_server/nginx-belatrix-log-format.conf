# Include once in /etc/nginx/conf.d/ (loaded inside http {})
# Enables detailed Belatrix traffic logs for bandwidth + bot analysis.

log_format belatrix_traffic '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';
