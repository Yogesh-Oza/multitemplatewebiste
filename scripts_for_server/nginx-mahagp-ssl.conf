# MahaGP — HTTPS reverse proxy (after Let's Encrypt wildcard cert)
# DNS: mahagp.in + www + *.mahagp.in → 159.89.161.19
# App: Next.js on 127.0.0.1:3008 (pm2: mahagp)
# Cert: certbot certonly --manual --preferred-challenges dns -d mahagp.in -d '*.mahagp.in'

server {
    listen 80;
    listen [::]:80;
    server_name mahagp.in www.mahagp.in *.mahagp.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mahagp.in www.mahagp.in *.mahagp.in;

    ssl_certificate /etc/letsencrypt/live/mahagp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahagp.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/mahagp-access.log;
    error_log /var/log/nginx/mahagp-error.log warn;

    client_max_body_size 200M;

    location ~* (^|/)\.env {
        access_log off;
        return 403;
    }
    location ~* (^|/)\.git {
        access_log off;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
